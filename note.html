<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Note - Kiritassi</title>
    <link rel="stylesheet" href="note.css">
</head>
<body>
    <nav>
        <div class="app-header">
            <h1>Kiritassi</h1>
        </div>
        <ul>
            <li onclick="goHome()">← Retour</li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="note-editor">
            <input type="text" id="noteTitle" class="note-title-input" placeholder="Titre de la note...">
            
            <div class="editor-toolbar">
                <button class="format-btn" onclick="applyFormat('gras')" title="Gras (Ctrl+B)">
                    <strong>G</strong>
                </button>
                <button class="format-btn" onclick="applyFormat('sousligné')" title="Souligné (Ctrl+U)">
                    <u>S</u>
                </button>
                <button class="format-btn" onclick="applyFormat('titre')" title="Titre">
                    H1
                </button>
                <button class="format-btn" onclick="applyFormat('soustitre')" title="Sous-titre">
                    H2
                </button>
            </div>
            
            <div id="noteContent" class="note-content-editor" contenteditable="true" placeholder="Écrivez votre note ici..."></div>
            
            <div class="editor-header">
                <button class="back-btn" onclick="goHome()">← Retour</button>
                <span id="saveStatus" class="save-status"></span>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
